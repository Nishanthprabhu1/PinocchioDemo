<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Explore Italy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">

<!-- Preload model-viewer module so it's ready before any tap -->
<link rel="modulepreload" href="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">

<!-- Non-render-blocking fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</noscript>

<!-- Preload first card poster (LCP) -->
<link rel="preload" as="image" href="ExploreItally/amalficoast/amalficoast.png" fetchpriority="high">

<style>
:root{
  --ink:#080604;
  --paper:#F0E8D5;
  --gold:#B8973A;
  --gold2:#D4AE52;
  --ff-en:'Cormorant Garamond','Palatino Linotype','Big Caslon',Georgia,serif;
  --ff-ui:'DM Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--ff-ui);
  height:100svh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.back-btn{
  position:fixed;
  left:16px;
  top:max(env(safe-area-inset-top),14px);
  z-index:100;
  text-decoration:none;
  color:var(--paper);
  background:rgba(255,255,255,.08);
  padding:10px 16px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  font-size:11px;
}

.nav-header{
  padding:max(env(safe-area-inset-top),20px) 20px 16px;
  text-align:center;
  border-bottom:1px solid rgba(184,151,58,.2);
}
.nav-header h1{
  font-family:var(--ff-en);
  font-size:clamp(28px,6vw,40px);
  color:var(--gold2);
  letter-spacing:.08em;
}
.nav-header p{
  margin-top:6px;
  font-size:10px;
  letter-spacing:.28em;
  text-transform:uppercase;
  opacity:.6;
}

.explorer-grid{
  flex:1;
  display:flex;
  align-items:center;
  gap:18px;
  padding:20px 16px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  will-change:scroll-position;
}
.explorer-grid::-webkit-scrollbar{display:none}

.landmark-card{
  flex:0 0 min(85vw,360px);
  height:min(64vh,540px);
  background:#0f0c09;
  border:1px solid rgba(184,151,58,.25);
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  scroll-snap-align:center;
  content-visibility:auto;
  contain-intrinsic-size:auto min(64vh,540px);
}

/* ── MODEL VIEWER WRAP ── */
.model-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
  background:radial-gradient(circle at center,#1b160c 0%,#080604 100%);
}

/* Photo fallback — shown while model loads, hidden after */
.model-photo{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.model-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.model-photo .emoji-fallback{
  font-size:80px;
  display:none;
}

/* Poster fades out once model-active is set */
.model-wrap.model-active .model-photo{
  opacity:0;
  pointer-events:none;
  transition:opacity .45s;
}

/* model-viewer wrapper — opacity-controlled, same pattern as menu page */
.mv-wrapper{
  position:absolute;
  inset:0;
  z-index:2;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}
.mv-wrapper.mv-visible{
  opacity:1;
  pointer-events:auto;
}

model-viewer{
  display:block;
  width:100%;
  height:100%;
  background:transparent;
  --poster-color:transparent;
  --progress-bar-color:#D4AE52;
  position:absolute;
  inset:0;
  touch-action:pan-y pinch-zoom;
}
model-viewer::part(default-progress-bar){ display:none }
model-viewer > [slot="ar-button"]{ display:none !important }

/* Loader overlay */
.mv-loader{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  background:rgba(8,6,4,.85);
  transition:opacity .3s;
}
.mv-loader.hidden{
  opacity:0;
  pointer-events:none;
}
.loader-ring{
  width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid rgba(184,151,58,.15);
  border-top-color:var(--gold2);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-bar-track{
  width:110px;
  height:3px;
  background:rgba(184,151,58,.18);
  border-radius:10px;
  overflow:hidden;
}
.loader-bar-fill{
  height:100%;
  width:0;
  background:var(--gold2);
  transition:width .1s linear;
}
.loader-label{
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold2);
}

/* Error overlay */
.error-overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  background:rgba(8,6,4,.7);
  z-index:12;
}
.error-overlay.show{display:flex}
.error-icon{font-size:28px;opacity:.5}
.error-msg{
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  opacity:.5;
  text-align:center;
  padding:0 20px;
}

/* Retry button */
.retry-btn{
  display:none;
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(184,151,58,.15);
  border:1px solid rgba(184,151,58,.4);
  color:var(--gold2);
  border-radius:30px;
  padding:8px 20px;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  cursor:pointer;
  z-index:15;
  white-space:nowrap;
}
.retry-btn.show{display:block}

/* AR Ready badge */
.ar-badge{
  position:absolute;
  right:12px;
  top:12px;
  padding:6px 12px;
  border-radius:30px;
  font-size:9px;
  background:rgba(8,6,4,.8);
  border:1px solid var(--gold);
  color:var(--gold2);
  opacity:0;
  transform:translateY(-8px);
  transition:.4s;
  z-index:8;
  pointer-events:none;
}
.ar-badge.visible{
  opacity:1;
  transform:translateY(0);
}

/* Pinch hint */
.pinch-hint{
  position:absolute;
  bottom:56px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(8,6,4,.8);
  border:1px solid rgba(184,151,58,.35);
  padding:7px 14px;
  border-radius:30px;
  font-size:9px;
  letter-spacing:.12em;
  color:var(--gold2);
  z-index:10;
  opacity:0;
  white-space:nowrap;
  pointer-events:none;
}
.mv-wrapper.mv-visible ~ .pinch-hint{
  opacity:1;
  animation:fadeout 4s ease 2s forwards;
}
@keyframes fadeout{to{opacity:0}}

/* AR not-supported notice */
.ar-not-supported{
  display:none;
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  background:rgba(8,6,4,.9);
  border:1px solid rgba(184,151,58,.3);
  padding:7px 16px;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(212,174,82,.6);
  white-space:nowrap;
  border-radius:30px;
}

/* AR launch button — full-width at bottom of viewer */
.ar-launch-wrap{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:9;
  display:none;
}
.ar-launch-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
  border:none;
  padding:11px 28px;
  font-family:var(--ff-ui);
  font-size:11px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
  border-radius:30px;
  white-space:nowrap;
  min-height:44px;
  box-shadow:0 4px 18px rgba(184,151,58,.45);
  transition:opacity .15s;
}
.ar-launch-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* ── INFO PANEL ── */
.landmark-info{
  padding:16px;
  background:#11100d;
}
.landmark-name{
  font-family:var(--ff-en);
  font-size:28px;
  margin-bottom:4px;
}
.landmark-city{
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
}

.btn-row{display:flex;gap:8px}
.action-btn{
  border:none;
  border-radius:10px;
  padding:13px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  min-height:46px;
  cursor:pointer;
  transition:opacity .2s;
}
.action-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.view3d-btn{
  background:rgba(184,151,58,.14);
  color:var(--gold2);
  border:1px solid rgba(184,151,58,.35);
}
.view3d-btn.is-active{background:rgba(184,151,58,.25)}
.ar-btn{
  flex:1;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;
}
.ar-btn.error{
  background:rgba(184,151,58,.15);
  color:rgba(212,174,82,.5);
  border:1px solid rgba(184,151,58,.2);
}

/* ── SCROLL DOTS ── */
.scroll-dots{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:12px 0 max(env(safe-area-inset-bottom),14px);
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(184,151,58,.25);
  transition:transform .2s, background .2s;
}
.dot.active{
  background:var(--gold2);
  transform:scale(1.35);
}
</style>
</head>
<body>

<a href="FunZone.html" class="back-btn">← Back</a>

<div class="nav-header">
  <h1>Explore Italy</h1>
  <p>Augmented Reality Landmarks</p>
</div>

<div class="explorer-grid" id="grid"></div>
<div class="scroll-dots" id="dots"></div>

<script>
/* ═══════════════════════════════════════════════════
   MODULE — import immediately so it's ready on tap
═══════════════════════════════════════════════════ */
let mvModuleReady = false;
let mvModulePromise = null;

function ensureMV() {
  if (!mvModulePromise) {
    mvModulePromise = import('https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js')
      .then(() => { mvModuleReady = true; });
  }
  return mvModulePromise;
}
// Start downloading immediately on page load
ensureMV();

/* ═══════════════════════════════════════════════════
   LANDMARK CONFIG
   scale  = real-world AR size multiplier
            (desired metres ÷ model native metres)
   orbit  = "thetaDeg phiDeg radiusPct" for 3D preview
═══════════════════════════════════════════════════ */
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const landmarks = [
  {
    name: 'Amalfi Coast',
    city: 'Italy',
    folder: 'amalficoast',
    file: 'amalficoast',
    hasUsdz: true,
    scale: 1,
    orbit: '20deg 70deg 105%',
  },
  {
    name: 'Colosseum',
    city: 'Italy',
    folder: 'colosseum',
    file: 'colosseum',
    hasUsdz: true,
    scale: 1,
    orbit: '30deg 65deg 110%',
  },
  {
    name: 'Duomo Museum',
    city: 'Italy',
    folder: 'duomo-museum',
    file: 'duomo-museum',
    hasUsdz: true,
    scale: 1,
    orbit: '0deg 60deg 105%',
  },
  {
    name: 'Leaning Tower of Pisa',
    city: 'Italy',
    folder: 'leaning-tower-of-pisa',
    file: 'leaning-tower-of-pisa',
    hasUsdz: true,
    scale: 1,
    orbit: '15deg 65deg 105%',
  },
];

/* ═══════════════════════════════════════════════════
   GLB PREFETCH
═══════════════════════════════════════════════════ */
const prefetched = new Set();
function prefetchGlb(path) {
  if (!path || prefetched.has(path)) return;
  prefetched.add(path);
  const link = document.createElement('link');
  link.rel = 'prefetch'; link.href = path;
  link.as = 'fetch'; link.crossOrigin = 'anonymous';
  document.head.appendChild(link);
}

/* ═══════════════════════════════════════════════════
   BUILD CARDS
═══════════════════════════════════════════════════ */
const grid   = document.getElementById('grid');
const dotsEl = document.getElementById('dots');
const state  = {};

landmarks.forEach((l, i) => {
  const base     = `ExploreItally/${l.folder}/${l.file}`;
  const glbPath  = `${base}.glb`;
  const usdzPath = `${base}.usdz`;
  const pngPath  = `${base}.png`;
  const isFirst  = i === 0;

  const card = document.createElement('div');
  card.className = 'landmark-card';
  card.dataset.index = i;

  card.innerHTML = `
  <div class="model-wrap" id="wrap-${i}">

    <!-- Photo fallback shown while model loads -->
    <div class="model-photo" id="photo-${i}">
      <img src="${pngPath}" alt="${l.name}"
           loading="${isFirst ? 'eager' : 'lazy'}"
           ${isFirst ? 'fetchpriority="high"' : ''}
           decoding="async"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="emoji-fallback">🏛️</span>
    </div>

    <!-- model-viewer in opacity wrapper — same pattern as menu AR page -->
    <div class="mv-wrapper" id="mvwrap-${i}">
      <model-viewer
        id="mv-${i}"
        src="${glbPath}"
        ${isIOS && l.hasUsdz ? `ios-src="${usdzPath}"` : ''}
        ar
        ar-modes="${isIOS ? 'quick-look webxr' : 'scene-viewer webxr'}"
        ar-placement="floor"
        ar-scale="auto"
        xr-environment
        camera-controls
        touch-action="pan-y pinch-zoom"
        shadow-intensity="1.2"
        shadow-softness="0.8"
        environment-image="neutral"
        exposure="1.1"
        camera-orbit="${l.orbit}"
        min-camera-orbit="auto auto 60%"
        max-camera-orbit="auto auto 140%"
        field-of-view="18deg"
        interpolation-decay="200"
        interaction-prompt="none"
        loading="${isFirst ? 'eager' : 'lazy'}"
        reveal="manual">
        <button slot="ar-button" aria-hidden="true" style="display:none"></button>
      </model-viewer>
    </div>

    <!-- Loader -->
    <div class="mv-loader" id="mvloader-${i}">
      <div class="loader-ring"></div>
      <div class="loader-bar-track"><div class="loader-bar-fill" id="bar-${i}"></div></div>
      <div class="loader-label"    id="lbl-${i}">Loading model…</div>
    </div>

    <!-- Error -->
    <div class="error-overlay" id="erroverlay-${i}">
      <div class="error-icon">⚠︎</div>
      <div class="error-msg" id="errmsg-${i}">Model unavailable</div>
    </div>
    <button class="retry-btn" id="retry-${i}">↺ Retry</button>

    <!-- AR Ready badge -->
    <div class="ar-badge"   id="badge-${i}">✦ AR Ready</div>

    <!-- Pinch hint -->
    <div class="pinch-hint">⟺ Pinch Zoom · Drag Rotate · Place in AR</div>

    <!-- AR not supported notice -->
    <div class="ar-not-supported" id="arnosup-${i}">AR not supported on this device</div>

    <!-- Custom AR launch button (same as menu page) -->
    <div class="ar-launch-wrap" id="arwrap-${i}">
      <button class="ar-launch-btn" id="arlaunch-${i}">✦ Place in Real World</button>
    </div>

  </div>

  <div class="landmark-info">
    <div class="landmark-name">${l.name}</div>
    <div class="landmark-city">${l.city}</div>
    <div class="btn-row">
      <button class="action-btn view3d-btn" id="v3dbtn-${i}">⬡ 3D</button>
      <button class="action-btn ar-btn"     id="arbtn-${i}">🪐 View in AR</button>
    </div>
  </div>`;

  grid.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dotsEl.appendChild(dot);

  state[i] = {
    glbPath, usdzPath, pngPath,
    scale: l.scale,
    orbit: l.orbit,
    ready: false, loading: false, showing3D: false, errored: false,
    pending3D: false, pendingAR: false,
    wired: false,
  };
});

/* ═══════════════════════════════════════════════════
   APPLY SCALE + ORBIT to model-viewer
   Called synchronously before src is ever set,
   so model parses at correct size (no flash).
   Also sets --ar-scale CSS var for fixed AR sizing.
═══════════════════════════════════════════════════ */
function applyScale(mv, scale, orbit) {
  const s = (scale ?? 1).toFixed(6);
  mv.setAttribute('scale', `${s} ${s} ${s}`);
  mv.style.setProperty('--ar-scale', s);
  if (orbit) mv.setAttribute('camera-orbit', orbit);
}

/* ═══════════════════════════════════════════════════
   WIRE CARD — attach events (done lazily per card)
═══════════════════════════════════════════════════ */
function wireCard(i) {
  const s = state[i];
  if (s.wired) return;
  s.wired = true;

  const l         = landmarks[i];
  const mv        = document.getElementById(`mv-${i}`);
  const mvwrap    = document.getElementById(`mvwrap-${i}`);
  const mvloader  = document.getElementById(`mvloader-${i}`);
  const bar       = document.getElementById(`bar-${i}`);
  const lbl       = document.getElementById(`lbl-${i}`);
  const badge     = document.getElementById(`badge-${i}`);
  const photo     = document.getElementById(`photo-${i}`);
  const wrap      = document.getElementById(`wrap-${i}`);
  const erroverlay= document.getElementById(`erroverlay-${i}`);
  const errmsg    = document.getElementById(`errmsg-${i}`);
  const retrybtn  = document.getElementById(`retry-${i}`);
  const arlaunch  = document.getElementById(`arlaunch-${i}`);
  const arwrap    = document.getElementById(`arwrap-${i}`);
  const arnosup   = document.getElementById(`arnosup-${i}`);
  const arbtn     = document.getElementById(`arbtn-${i}`);
  const v3dbtn    = document.getElementById(`v3dbtn-${i}`);

  Object.assign(s, { mv, mvwrap, mvloader, bar, lbl, badge, photo, wrap,
                     erroverlay, errmsg, retrybtn, arlaunch, arwrap, arnosup, arbtn, v3dbtn });

  // Apply correct scale BEFORE src is ever assigned — prevents wrong-size flash
  applyScale(mv, s.scale, s.orbit);

  // Progress events
  mv.addEventListener('progress', e => {
    const pct = Math.round(e.detail.totalProgress * 100);
    bar.style.width = pct + '%';
    lbl.textContent = `Loading ${pct}%`;
  });

  // Load complete — reveal model (dismissPoster = reveal="manual" gate)
  mv.addEventListener('load', () => {
    s.ready = true; s.loading = false; s.errored = false;

    // Safety-net: confirm scale is correct, THEN reveal
    applyScale(mv, s.scale, s.orbit);
    mv.dismissPoster(); // ← critical: reveals model at correct size

    mvloader.classList.add('hidden');
    erroverlay.classList.remove('show');
    retrybtn.classList.remove('show');
    badge.classList.add('visible');

    // Show/hide AR launch button based on device capability
    updateARUI(i);

    if (s.pending3D) { s.pending3D = false; activate3D(i); }
    if (s.pendingAR) { s.pendingAR = false; doActivateAR(i); }
  });

  // Load error
  mv.addEventListener('error', () => {
    s.ready = false; s.loading = false; s.errored = true;
    mvloader.classList.add('hidden');
    fetch(s.glbPath, { method: 'HEAD' })
      .then(r => { errmsg.textContent = r.ok ? 'Model may be corrupted' : `File not found (${r.status})`; })
      .catch(() => { errmsg.textContent = 'Serve via localhost, not file://'; });
    erroverlay.classList.add('show');
    retrybtn.classList.add('show');
    arbtn.disabled = true;
    arbtn.classList.add('error');
    arbtn.textContent = 'Unavailable';
  });

  // AR status — update button label based on AR session state
  mv.addEventListener('ar-status', e => {
    const status = e.detail.status;
    if (status === 'session-started') {
      arlaunch.textContent = '✦ AR Active';
      arlaunch.disabled = false;
    }
    if (status === 'failed' || status === 'not-presenting') {
      arlaunch.textContent = '✦ Place in Real World';
      arlaunch.disabled = false;
    }
  });

  // 3D toggle button
  v3dbtn.onclick = () => toggle3D(i);

  // Bottom bar AR button (loads + launches)
  arbtn.onclick = () => launchAR(i);

  // Custom floating AR launch button (only shown when model is ready + AR supported)
  arlaunch.addEventListener('click', () => {
    if (arlaunch.disabled) return;
    if (!s.ready) {
      // Model still loading — wait for it
      arlaunch.disabled = true;
      arlaunch.textContent = '⏳ Loading…';
      mv.addEventListener('load', () => {
        arlaunch.disabled = false;
        arlaunch.textContent = '✦ Place in Real World';
        doActivateAR(i);
      }, { once: true });
    } else {
      doActivateAR(i);
    }
  });

  // Retry button
  retrybtn.onclick = () => {
    arbtn.disabled = false;
    arbtn.classList.remove('error');
    arbtn.textContent = '🪐 View in AR';
    startLoad(i);
  };

  // Prefetch on hover/touch
  const card = grid.querySelectorAll('.landmark-card')[i];
  card.addEventListener('mouseenter', () => prefetchGlb(s.glbPath), { once: true, passive: true });
  card.addEventListener('touchstart',  () => prefetchGlb(s.glbPath), { once: true, passive: true });
}

/* ═══════════════════════════════════════════════════
   UPDATE AR UI — shows floating button or notice
═══════════════════════════════════════════════════ */
function updateARUI(i) {
  const s = state[i];
  if (!s.mv) return;

  // Always show AR button
  s.arwrap.style.display = 'flex';
  s.arnosup.style.display = 'none';
}

/* ═══════════════════════════════════════════════════
   START LOAD
   Scale is applied synchronously before src set —
   model parses at correct size, reveal="manual"
   keeps it hidden until dismissPoster() is called.
═══════════════════════════════════════════════════ */
function startLoad(i) {
  const s = state[i];
  if (s.loading || s.ready) return;
  s.loading = true;
  s.errored = false;

  if (!s.wired) wireCard(i);

  s.erroverlay.classList.remove('show');
  s.retrybtn.classList.remove('show');
  s.mvloader.classList.remove('hidden');
  s.bar.style.width = '0%';
  s.lbl.textContent = 'Loading model…';

  // Scale MUST be applied before setting src
  applyScale(s.mv, s.scale, s.orbit);

  ensureMV().then(() => {
    if (!state[i].loading) return; // cancelled
    s.mv.setAttribute('loading', 'eager');
    if (!s.mv.getAttribute('src') || s.mv.getAttribute('src') === '') {
      s.mv.setAttribute('src', s.glbPath);
    }
  });
}

/* ═══════════════════════════════════════════════════
   3D VIEW
═══════════════════════════════════════════════════ */
function activate3D(i) {
  const s = state[i];
  s.showing3D = true;
  s.photo.style.opacity = '0';
  s.mvwrap.classList.add('mv-visible');
  s.wrap.classList.add('model-active');
  s.v3dbtn.classList.add('is-active');
  s.v3dbtn.innerHTML = '✕ 2D';
  s.wrap.addEventListener('touchstart', stopProp, { passive: false });
}

function deactivate3D(i) {
  const s = state[i];
  s.showing3D = false;
  s.photo.style.opacity = '';
  s.mvwrap.classList.remove('mv-visible');
  s.wrap.classList.remove('model-active');
  s.v3dbtn.classList.remove('is-active');
  s.v3dbtn.innerHTML = '⬡ 3D';
  s.wrap.removeEventListener('touchstart', stopProp);
}

function stopProp(e) { e.stopPropagation(); }

function toggle3D(i) {
  const s = state[i];
  if (s.showing3D) { deactivate3D(i); return; }
  if (s.ready)     { activate3D(i); }
  else             { s.pending3D = true; startLoad(i); }
}

/* ═══════════════════════════════════════════════════
   AR LAUNCH
   Uses canActivateAR check + custom floating button
   pattern from the menu page.
═══════════════════════════════════════════════════ */
function doActivateAR(i) {
  const s = state[i];

  try {

    // Force reveal before AR
    s.mv.dismissPoster();

    // Small delay improves Android launch stability
    setTimeout(() => {
      s.mv.activateAR();
    }, 150);

  } catch (e) {

    console.warn('AR launch failed:', e);

    s.arnosup.style.display = 'block';
    s.arnosup.textContent = 'AR failed to launch';

  }
}

function launchAR(i) {

  const s = state[i];

  // Open 3D automatically before AR
  if (!s.showing3D) {
    activate3D(i);
  }

  if (s.ready) {

    doActivateAR(i);

  } else {

    s.pendingAR = true;

    startLoad(i);

  }
}

/* ═══════════════════════════════════════════════════
   TAB VISIBILITY — pause/play model-viewer
═══════════════════════════════════════════════════ */
document.addEventListener('visibilitychange', () => {
  Object.values(state).forEach(s => {
    if (!s.mv || !mvModuleReady) return;
    if (document.hidden) {
      if (typeof s.mv.pause === 'function') s.mv.pause();
    } else {
      if (typeof s.mv.play  === 'function') s.mv.play();
    }
  });
});

/* ═══════════════════════════════════════════════════
   LAZY WIRE via IntersectionObserver
═══════════════════════════════════════════════════ */
requestAnimationFrame(() => wireCard(0));

const wireObs = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      wireCard(+entry.target.dataset.index);
      wireObs.unobserve(entry.target);
    }
  });
}, { root: grid, rootMargin: '0px 300px 0px 300px', threshold: 0 });

grid.querySelectorAll('.landmark-card').forEach((card, i) => {
  if (i > 0) wireObs.observe(card);
});

/* ═══════════════════════════════════════════════════
   SCROLL DOTS — rAF debounced
═══════════════════════════════════════════════════ */
const dots = dotsEl.querySelectorAll('.dot');
let scrollRaf = false;

grid.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = true;
  requestAnimationFrame(() => {
    scrollRaf = false;
    const center = grid.scrollLeft + grid.clientWidth / 2;
    let closest = 0, minDist = Infinity;
    grid.querySelectorAll('.landmark-card').forEach((card, ci) => {
      const dist = Math.abs((card.offsetLeft + card.offsetWidth / 2) - center);
      if (dist < minDist) { minDist = dist; closest = ci; }
    });
    dots.forEach((d, di) => d.classList.toggle('active', di === closest));
    if (state[closest]) prefetchGlb(state[closest].glbPath);
  });
}, { passive: true });

/* ═══════════════════════════════════════════════════
   PREFETCH FIRST CARD GLB on idle
═══════════════════════════════════════════════════ */
const idle = window.requestIdleCallback || (cb => setTimeout(cb, 200));
idle(() => prefetchGlb(`ExploreItally/${landmarks[0].folder}/${landmarks[0].file}.glb`));
</script>

</body>
</html>
