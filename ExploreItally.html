<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>

<title>Italian Language Guide</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
--ink:#080604;
--paper:#F0E8D5;
--gold:#B8973A;
--gold2:#D4AE52;
--card:#0f0c09;
--ff-en:'Cormorant Garamond',serif;
--ff-ui:'DM Sans',sans-serif;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:
linear-gradient(rgba(8,6,4,.92), rgba(8,6,4,.96)),
url('https://images.unsplash.com/photo-1516483638261-f4dbaf036963?q=80&w=1600&auto=format&fit=crop');
background-size:cover;
background-position:center;
color:var(--paper);
font-family:var(--ff-ui);
min-height:100vh;
overflow-x:hidden;
}

.page{
max-width:1100px;
margin:auto;
padding:20px;
}

.hero{
padding:40px 0 30px;
text-align:center;
border-bottom:1px solid rgba(184,151,58,.18);
margin-bottom:28px;
}

.hero h1{
font-family:var(--ff-en);
font-size:clamp(42px,8vw,82px);
font-weight:600;
letter-spacing:.06em;
color:var(--gold2);
line-height:1;
}

.hero p{
margin-top:12px;
font-size:11px;
letter-spacing:.28em;
text-transform:uppercase;
opacity:.65;
}

.tip{
background:rgba(255,255,255,.05);
border:1px solid rgba(184,151,58,.25);
border-radius:16px;
padding:18px 20px;
margin-bottom:24px;
line-height:1.7;
font-size:14px;
color:rgba(240,232,213,.8);
backdrop-filter:blur(10px);
}

.tip b{
color:var(--gold2);
}

.filter-bar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.cat-btn{
border:none;
background:rgba(255,255,255,.05);
border:1px solid rgba(184,151,58,.25);
color:var(--paper);
padding:12px 18px;
border-radius:999px;
font-size:11px;
letter-spacing:.12em;
text-transform:uppercase;
cursor:pointer;
transition:.25s;
}

.cat-btn:hover{
background:rgba(184,151,58,.18);
}

.cat-btn.active{
background:linear-gradient(135deg,var(--gold),var(--gold2));
color:#000;
font-weight:600;
}

.phrase-count{
font-size:12px;
letter-spacing:.16em;
text-transform:uppercase;
opacity:.45;
margin-bottom:18px;
}

.table-wrap{
display:flex;
flex-direction:column;
gap:16px;
}

.group-title{
font-size:11px;
letter-spacing:.25em;
text-transform:uppercase;
color:var(--gold2);
margin:20px 4px 6px;
}

.word-row{
display:grid;
grid-template-columns:1fr 1fr;
background:rgba(15,12,9,.88);
border:1px solid rgba(184,151,58,.18);
border-radius:22px;
overflow:hidden;
backdrop-filter:blur(12px);
transition:.25s;
}

.word-row:hover{
transform:translateY(-2px);
border-color:rgba(212,174,82,.4);
}

.col-en{
padding:26px;
border-right:1px solid rgba(184,151,58,.12);
}

.en-phrase{
display:block;
font-family:var(--ff-en);
font-size:32px;
font-weight:600;
line-height:1.1;
margin-bottom:8px;
}

.en-ctx{
font-size:13px;
letter-spacing:.08em;
opacity:.45;
}

.col-it{
padding:26px 80px 26px 26px;
position:relative;
display:flex;
flex-direction:column;
justify-content:center;
}

.it-rom{
font-family:var(--ff-en);
font-size:34px;
font-weight:700;
color:var(--gold2);
line-height:1;
margin-bottom:8px;
}

.it-main{
font-size:15px;
letter-spacing:.08em;
opacity:.7;
}

.speak-btn{
position:absolute;
right:22px;
top:50%;
transform:translateY(-50%);
width:54px;
height:54px;
border-radius:50%;
border:none;
background:rgba(184,151,58,.14);
border:1px solid rgba(184,151,58,.35);
color:var(--gold2);
font-size:18px;
cursor:pointer;
transition:.25s;
}

.speak-btn:hover{
background:linear-gradient(135deg,var(--gold),var(--gold2));
color:#000;
transform:translateY(-50%) scale(1.08);
}

.footer{
text-align:center;
padding:40px 0 20px;
font-size:11px;
letter-spacing:.22em;
text-transform:uppercase;
opacity:.35;
}

@media(max-width:800px){

.word-row{
grid-template-columns:1fr;
}

.col-en{
border-right:none;
border-bottom:1px solid rgba(184,151,58,.12);
}

.en-phrase{
font-size:26px;
}

.it-rom{
font-size:28px;
}

.col-it{
padding-right:90px;
}

.hero h1{
font-size:54px;
}

}

</style>
</head>

<body>

<div class="page">

<div class="hero">
<h1>Italiano</h1>
<p>Italian Language Learning Guide</p>
</div>

<div class="tip">
🔊 <b>Tap the speaker icon</b> to hear real Italian pronunciation.
Perfect for restaurants, travel, cafés & daily conversation in Italy 🇮🇹
</div>

<div class="filter-bar" id="filter-bar"></div>

<div class="phrase-count" id="phrase-count"></div>

<div class="table-wrap" id="list"></div>

<div class="footer">
Explore Italy • Learn Italian • Speak Like A Local
</div>

</div>

<script>

const ALL=[

{
en:"Good Morning",
ctx:"Morning greeting",
cat:"greet",
it:"Buongiorno",
rom:"bwon-jor-no"
},

{
en:"Good Evening",
ctx:"Evening greeting",
cat:"greet",
it:"Buonasera",
rom:"bwo-na-se-ra"
},

{
en:"Hello",
ctx:"Casual greeting",
cat:"greet",
it:"Ciao",
rom:"chao"
},

{
en:"Thank You",
ctx:"General thanks",
cat:"thanks",
it:"Grazie",
rom:"gra-tsye"
},

{
en:"Thank You Very Much",
ctx:"Formal thanks",
cat:"thanks",
it:"Grazie mille",
rom:"gra-tsye mee-le"
},

{
en:"You're Welcome",
ctx:"Reply to thanks",
cat:"thanks",
it:"Prego",
rom:"pre-go"
},

{
en:"Please",
ctx:"Polite request",
cat:"polite",
it:"Per favore",
rom:"per fa-vo-re"
},

{
en:"Excuse Me",
ctx:"Getting attention",
cat:"polite",
it:"Scusi",
rom:"skoo-zee"
},

{
en:"Sorry",
ctx:"Apologizing",
cat:"polite",
it:"Mi dispiace",
rom:"mee dee-spya-che"
},

{
en:"One Pizza Please",
ctx:"Ordering food",
cat:"restaurant",
it:"Una pizza, per favore",
rom:"oo-na peet-sa per fa-vo-re"
},

{
en:"Coffee Please",
ctx:"Ordering coffee",
cat:"restaurant",
it:"Un caffè, per favore",
rom:"oon kaf-fe per fa-vo-re"
},

{
en:"The Bill Please",
ctx:"Asking to pay",
cat:"restaurant",
it:"Il conto, per favore",
rom:"eel kon-to per fa-vo-re"
},

{
en:"It's Delicious!",
ctx:"Complimenting food",
cat:"restaurant",
it:"Delizioso!",
rom:"de-lee-tsyo-so"
},

{
en:"I Am Vegetarian",
ctx:"Dietary preference",
cat:"restaurant",
it:"Sono vegetariano",
rom:"so-no ve-je-ta-ria-no"
},

{
en:"Where Is The Bathroom?",
ctx:"Asking directions",
cat:"travel",
it:"Dov'è il bagno?",
rom:"do-veh eel ban-yo"
},

{
en:"How Much Is This?",
ctx:"Checking price",
cat:"travel",
it:"Quanto costa?",
rom:"kwan-to kos-ta"
},

{
en:"I Need Help",
ctx:"Emergency phrase",
cat:"travel",
it:"Ho bisogno di aiuto",
rom:"o bee-zon-yo dee a-yoo-to"
},

{
en:"I Love Italy",
ctx:"Travel phrase",
cat:"travel",
it:"Amo l'Italia",
rom:"a-mo lee-ta-lia"
}

];

const CATS=[
{id:"all",label:"All"},
{id:"greet",label:"Greetings"},
{id:"thanks",label:"Thanks"},
{id:"polite",label:"Polite"},
{id:"restaurant",label:"Restaurant"},
{id:"travel",label:"Travel"}
];

let activeCat='all';

function buildFilters(){

const el=document.getElementById('filter-bar');

el.innerHTML=CATS.map(c=>`
<button class="cat-btn ${c.id===activeCat?'active':''}" data-c="${c.id}">
${c.label}
</button>
`).join('');

el.querySelectorAll('.cat-btn').forEach(btn=>{

btn.addEventListener('click',()=>{

activeCat=btn.dataset.c;

buildFilters();
render();

});

});

}

function speak(text){

const utter=new SpeechSynthesisUtterance(text);

utter.lang='it-IT';
utter.rate=.85;
utter.pitch=1;

speechSynthesis.cancel();
speechSynthesis.speak(utter);

}

function rowHTML(w){

return `

<div class="word-row">

<div class="col-en">
<span class="en-phrase">${w.en}</span>
<span class="en-ctx">${w.ctx}</span>
</div>

<div class="col-it">

<span class="it-rom">${w.rom}</span>

<span class="it-main">${w.it}</span>

<button class="speak-btn"
onclick="speak('${w.it.replace(/'/g,"\\'")}')">
🔊
</button>

</div>

</div>

`;

}

function render(){

const filtered=
activeCat==='all'
?ALL
:ALL.filter(w=>w.cat===activeCat);

document.getElementById('phrase-count').textContent=
`${filtered.length} phrases`;

if(activeCat==='all'){

const groups={};

filtered.forEach(w=>{

(groups[w.cat]=groups[w.cat]||[]).push(w);

});

document.getElementById('list').innerHTML=

Object.keys(groups).map(cat=>`

<div class="group-title">${cat}</div>

${groups[cat].map(rowHTML).join('')}

`).join('');

}else{

document.getElementById('list').innerHTML=
filtered.map(rowHTML).join('');

}

}

buildFilters();
render();

</script>

</body>
</html>
